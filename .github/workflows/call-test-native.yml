name: "Call: Test Native"

on:
  workflow_call:
    inputs:
      maven-repo-cache-key-prefix:
        description: "Cache Key for Maven Repository. The key created when saving a cache and the key used to search for a cache"
        required: false
        type: string
        default: "test-native-m2-repo"

jobs:
  test-native:
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        job:
          - { runner: ubuntu-latest,    platform: linux-amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
    name: "Test Native • ${{ matrix.job.platform }}"
    runs-on: ${{ matrix.job.runner }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "Prepare"
        uses: ./.github/actions/prepare
        with:
          maven-repo-cache-key: "${{ inputs.maven-repo-cache-key-prefix }}-${{ matrix.job.runner }}"

      - name: "Download ToolFetch Binary"
        uses: actions/download-artifact@v8
        with:
          name: toolfetch-binary-${{ matrix.job.platform }}
          path: target/

      - name: "Rename ToolFetch Binary"
        shell: bash
        env:
          MATRIX_JOB_PLATFORM: ${{ matrix.job.platform }}
        run: |
          mv target/toolfetch-*-${MATRIX_JOB_PLATFORM} target/toolfetch
          chmod +x target/toolfetch

      - name: "Smoke Test Native"
        working-directory: scripts
        shell: bash
        run: ./scan.sh --st-native

      - name: "Upload Test Reports"
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: smoke-test-native-report-${{ matrix.job.platform }}
          if-no-files-found: error
          path: target/failsafe-reports/**/TEST-*.xml
