name: "PR: Test Report"
run-name: "${{ github.workflow }} • ${{ github.event.workflow_run.head_branch }} • ${{ github.event.workflow_run.head_commit.message || github.sha }}"

on:
  workflow_run:
    workflows: [ "PR: Scan" ]
    types:
      - completed

jobs:
  test-report:
    name: "Test Report"
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.event == 'pull_request' }}
    permissions:
      contents: read
      actions: read
      checks: write
    uses: jdheim/toolfetch/.github/workflows/call-test-report.yml@main
