name: "Call: Assemble ToolFetch SBOMs"

on:
  workflow_call:
    inputs:
      release-type:
        description: "Release type"
        required: false
        type: string
        default: "SNAPSHOT"

jobs:
  toolfetch-sboms:
    name: "Assemble ToolFetch SBOMs"
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "Prepare"
        uses: ./.github/actions/prepare
        with:
          maven-repo-cache-key: toolfetch-sboms-m2-repo
          release-type: ${{ inputs.release-type }}

      - name: "Prepare Native Build"
        working-directory: scripts
        shell: bash
        run: ./build.sh --native-prepare

      - name: "Download ToolFetch SBOMs"
        uses: actions/download-artifact@v8
        with:
          pattern: toolfetch-sbom-*
          merge-multiple: true
          path: build/toolfetch-native-image/target/jreleaser/sbom

      - name: "Assemble ToolFetch SBOMs"
        uses: jreleaser/release-action@v2
        env:
          JRELEASER_ASSEMBLE_TOOLFETCH_SBOM_ACTIVE: ALWAYS
        with:
          version: 1.24.0 # @Patch Migrate to latest
          setup-java: false
          arguments: assemble --output-directory=build/toolfetch-native-image/target

      - name: "Upload ToolFetch SBOMs"
        uses: actions/upload-artifact@v6
        with:
          name: toolfetch-sboms
          if-no-files-found: error
          retention-days: 1
          path: |
            build/toolfetch-native-image/target/jreleaser/sbom/toolfetch*-sboms.zip

      - name: "Upload JReleaser output"
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: jreleaser-toolfetch-sboms
          path: |
            build/toolfetch-native-image/target/jreleaser/trace.log
            build/toolfetch-native-image/target/jreleaser/output.properties
