name: "Release"
run-name: "${{ github.workflow }} • ${{ github.ref_name }} • ${{ github.event.head_commit.message || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      project-version-bump-type:
        description: "Release version: PATCH uses the current target; MINOR/MAJOR starts a new release line"
        required: true
        type: choice
        options:
          - "PATCH"
          - "MINOR"
          - "MAJOR"
        default: "PATCH"
      release-type:
        description: "Release type"
        required: true
        type: choice
        options:
          - "EA"
          - "GA"
        default: "EA"
      draft-release:
        description: "Create draft release"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: "Prepare Release Version"
    permissions:
      contents: write
    uses: jdheim/toolfetch/.github/workflows/call-prepare-release.yml@main
    secrets:
      JDHEIM_ACTIONS_BOT_CLIENT_ID: ${{ secrets.JDHEIM_ACTIONS_BOT_CLIENT_ID }}
      JDHEIM_ACTIONS_BOT_PRIVATE_KEY: ${{ secrets.JDHEIM_ACTIONS_BOT_PRIVATE_KEY }}
    with:
      project-version-bump-type: ${{ inputs.project-version-bump-type }}
      release-type: ${{ inputs.release-type }}
      draft-release: ${{ inputs.draft-release }}

  release-prepared:
    name: "Start Prepared Release"
    needs: prepare-release
    timeout-minutes: 5
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: "Start Release at Prepared Commit"
        id: dispatch
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: release-prepared.yml
          ref: ${{ github.ref_name }}
          wait-for-completion: false
          inputs: |
            {
              "source-ref": ${{ toJSON(needs.prepare-release.outputs.source-ref) }},
              "project-version": ${{ toJSON(needs.prepare-release.outputs.version) }},
              "release-type": ${{ toJSON(inputs.release-type) }},
              "draft-release": ${{ toJSON(inputs.draft-release) }}
            }

      - name: "Link Prepared Release"
        shell: bash
        env:
          RELEASE_URL: ${{ steps.dispatch.outputs.runUrlHtml }}
        run: |
          printf 'Follow the [prepared release](%s) for build, publication, and provenance results.\n' "${RELEASE_URL}" >> "$GITHUB_STEP_SUMMARY"
