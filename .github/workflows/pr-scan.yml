name: "PR: Scan"
run-name: "${{ github.workflow }} • ${{ github.ref_name }} • ${{ github.event.pull_request.title || github.event.head_commit.message || github.sha }}"

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shellcheck:
    name: "ShellCheck"
    uses: jdheim/toolfetch/.github/workflows/call-shellcheck.yml@main
    permissions:
      contents: read

  scan:
    name: "Scan"
    uses: jdheim/toolfetch/.github/workflows/call-scan.yml@main
    permissions:
      contents: read
    with:
      maven-repo-cache-key-prefix: pr-scan-m2-repo

  jacoco-scan:
    name: "Jacoco Scan"
    uses: jdheim/toolfetch/.github/workflows/call-scan-jacoco.yml@main
    permissions:
      contents: read
    with:
      maven-repo-cache-key: pr-jacoco-scan-m2-repo
