environment:
  properties:
    graalVmDir: 'graalvm-jdk-25.0.4'
project:
  name: 'toolfetch'
  version: '0.0.6-SNAPSHOT'
  versionPattern: 'SEMVER'
  snapshot:
    pattern: '.*-(EA|SNAPSHOT)'
    fullChangelog: true
  description: 'CLI for fetching and installing external tools from release URLs (e.g. GitHub releases) using a YAML configuration file'
  longDescription: |
    **ToolFetch** is a CLI for **fetching and installing external tools**
    from release URLs (e.g. GitHub releases) using a YAML configuration file.

    It is designed for:

    - setting up new developer machines quickly and consistently
    - reproducible tool installations
  authors:
    - 'JDHeim.com'
  stereotype: 'CLI'
  inceptionYear: '2026'
  license: 'Apache-2.0'
  copyright: 'Copyright 2026 JDHeim.com'
  links:
    homepage: 'https://github.com/jdheim/toolfetch'
  languages:
    java:
      groupId: 'com.jdheim'
platform:
  replacements:
    x86_64: 'amd64'
    linux-x86_64: 'linux-amd64'
    aarch_64: 'arm64'
    linux-aarch_64: 'linux-arm64'
checksum:
  algorithms:
    - 'SHA_256'
  individual: true
signing:
  pgp:
    armored: true
    verify: true
    mode: 'MEMORY'
files:
  artifacts:
    - path: '{{outputDirectory}}/sbom/{{projectName}}-{{projectVersion}}-sboms.zip'
distributions:
  toolfetch:
    type: 'BINARY'
    artifacts:
      - path: '{{assembleDirectory}}/{{projectName}}/archive/{{projectName}}-{{projectVersion}}-linux-amd64.tar.gz'
        platform: 'linux-x86_64'
        extraProperties:
          graalVMNativeImage: 'true'
      - path: '{{assembleDirectory}}/{{projectName}}/archive/{{projectName}}-{{projectVersion}}-linux-arm64.tar.gz'
        platform: 'linux-aarch_64'
        extraProperties:
          graalVMNativeImage: 'true'
assemble:
  archive:
    toolfetch:
      distributionType: 'BINARY'
      attachPlatform: true
      formats:
        - 'TAR_GZ'
      options:
        longFileMode: 'POSIX'
        bigNumberMode: 'POSIX'
      artifacts:
        - path: '{{assembleDirectory}}/{{projectName}}_binary/native-image/{{projectName}}-{{projectVersion}}-{{osPlatformReplaced}}'
          transform: 'bin/{{projectName}}'
      fileSets:
        - input: "."
          includes:
            - "LICENSE"
            - "NOTICE"
            - "README.md"
        - input: "{{baseOutputDirectory}}/third-party/license"
          output: "licenses"
  nativeImage:
    toolfetch_binary:
      executable: '{{projectName}}-{{projectVersion}}'
      archiving:
        enabled: false
      graalJdks:
        - path: '{{basedir}}/target/jdks/graalvm-linux-amd64/{{graalVmDir}}'
          platform: 'linux-x86_64'
        - path: '{{basedir}}/target/jdks/graalvm-linux-arm64/{{graalVmDir}}'
          platform: 'linux-aarch_64'
      args:
        - '-H:+UnlockExperimentalVMOptions'
        - '--enable-sbom=embed,cyclonedx,strict'
        - '--emit=build-report={{baseOutputDirectory}}/{{projectName}}-{{projectVersion}}-{{osPlatformReplaced}}-build-report.html'
      mainJar:
        path: '{{baseOutputDirectory}}/{{projectName}}-commands-{{projectVersion}}.jar'
      jars:
        - pattern: '{{baseOutputDirectory}}/third-party/lib/*.jar'
    toolfetch_debug:
      executable: '{{projectName}}-{{projectVersion}}'
      archiving:
        enabled: false
      graalJdks:
        - path: '{{basedir}}/target/jdks/graalvm-linux-amd64/{{graalVmDir}}'
          platform: 'linux-x86_64'
        - path: '{{basedir}}/target/jdks/graalvm-linux-arm64/{{graalVmDir}}'
          platform: 'linux-aarch_64'
      args:
        - '-H:+UnlockExperimentalVMOptions'
        - '-H:+JDWP'
        - '--emit=build-report={{baseOutputDirectory}}/{{projectName}}-{{projectVersion}}-{{osPlatformReplaced}}-build-report.html'
      mainJar:
        path: '{{baseOutputDirectory}}/{{projectName}}-commands-{{projectVersion}}.jar'
      jars:
        - pattern: '{{baseOutputDirectory}}/third-party/lib/*.jar'
hooks:
  script:
    success:
      # Generate SBOM
      - run: |
          if [[ "${JRELEASER_ASSEMBLE_NATIVE_IMAGE_TOOLFETCH_BINARY_ACTIVE}" == "ALWAYS" ]]; then
            binary="$(find {{assembleDirectory}} -type f -name "{{projectName}}-{{projectVersion}}-{{osPlatformReplaced}}" -executable)"
            if [[ -z "${binary}" ]]; then
              echo "[sbom] Missing {{projectName}} binary"
              exit 1
            fi
            if command -v syft &>/dev/null; then
              echo "[sbom] Generate SPDX SBOM with Syft $(syft --version | awk '{print $2}')"
              sbomDirectory="{{outputDirectory}}/sbom"
              mkdir -p "${sbomDirectory}"
              sbom="${sbomDirectory}/{{projectName}}-{{projectVersion}}-{{osPlatformReplaced}}.spdx-json.sbom"
              syft file:"${binary}" -o spdx-json="${sbom}"
            else
              echo "[sbom] Syft not installed. Skipping"
            fi
          fi
        verbose: true
        filter:
          includes: ['assemble']
      # Compress with UPX
      - run: |
          if [[ "${JRELEASER_ASSEMBLE_NATIVE_IMAGE_TOOLFETCH_BINARY_ACTIVE}" == "ALWAYS" ]]; then
            binary="$(find {{assembleDirectory}} -type f -name "{{projectName}}-{{projectVersion}}-{{osPlatformReplaced}}" -executable)"
            if [[ -z "${binary}" ]]; then
              echo "[sbom] Missing {{projectName}} binary"
              exit 1
            fi
            originalFileSize=$(numfmt --to=iec --suffix=B --format="%.2f" "$(stat -c %s "${binary}")")
            if command -v upx &>/dev/null; then
              echo "[upx] Compress with UPX $(upx --version | head -n 1 | awk '{print $2}')"
              upx --best "${binary}"
              compressedFileSize=$(numfmt --to=iec --suffix=B --format="%.2f" "$(stat -c %s "${binary}")")
              echo "[upx] ${originalFileSize} compressed to ${compressedFileSize}"
            else
              echo "[upx] UPX not installed. Skipping"
            fi
          fi
        verbose: true
        filter:
          includes: ['assemble']
      # Copy a native image to the root target directory
      - run: |
          if [[ "${JRELEASER_ASSEMBLE_NATIVE_IMAGE_TOOLFETCH_BINARY_ACTIVE}" == "ALWAYS" ]]; then
            echo "[native-image] Copy a native image to the target directory"
            find {{assembleDirectory}} -type f -name "{{projectName}}-{{projectVersion}}-{{osPlatformReplaced}}" -executable -exec cp -v {} {{basedir}}/target/{{projectName}} \;
          fi
        verbose: true
        filter:
          includes: ['assemble']
      # Copy a native image with dependencies to the root target directory (debug mode enabled)
      - run: |
          if [[ "${JRELEASER_ASSEMBLE_NATIVE_IMAGE_TOOLFETCH_DEBUG_ACTIVE}" == "ALWAYS" ]]; then
            echo "[native-image] Copy a native image with dependencies to the target directory (debug mode enabled)"
            if [[ ! -d ${HOME}/.libsvmjdwp/graalvm-{{osPlatformReplaced}}/{{graalVmDir}} ]]; then
              {{basedir}}/target/jdks/graalvm-{{osPlatformReplaced}}/{{graalVmDir}}/bin/native-image --macro:svmjdwp-library
              [[ -d ${HOME}/.libsvmjdwp ]] && rm -r ${HOME}/.libsvmjdwp
              mkdir -p ${HOME}/.libsvmjdwp/graalvm-{{osPlatformReplaced}}/{{graalVmDir}}
              cp -v {{basedir}}/target/jdks/graalvm-{{osPlatformReplaced}}/{{graalVmDir}}/lib/libsvmjdwp.so ${HOME}/.libsvmjdwp/graalvm-{{osPlatformReplaced}}/{{graalVmDir}}/
            fi
            cp -v ${HOME}/.libsvmjdwp/graalvm-{{osPlatformReplaced}}/{{graalVmDir}}/libsvmjdwp.so {{basedir}}/target
            find {{assembleDirectory}} -type f -name "{{projectName}}-{{projectVersion}}-{{osPlatformReplaced}}" -executable -exec cp -v {} {{basedir}}/target/{{projectName}} \;
            find {{assembleDirectory}} -type f -name "{{projectName}}-{{projectVersion}}-{{osPlatformReplaced}}.metadata" -exec cp -v {} {{basedir}}/target/{{projectName}}.metadata \;
            echo "[native-image] To attach a debugger, run with: -XX:JDWPOptions=transport=dt_socket,server=y,address=5005"
          fi
        verbose: true
        filter:
          includes: ['assemble']
      # Assemble SBOM
      - run: |
          if [[ "${JRELEASER_ASSEMBLE_TOOLFETCH_SBOM_ACTIVE}" == "ALWAYS" ]]; then
            sbomDirectory="{{outputDirectory}}/sbom"
            set +x
            if [[ ! -d "${sbomDirectory}" ]]; then
              echo "[sbom] Missing SBOM"
              exit 1
            fi
            sboms="$(find "${sbomDirectory}" -type f -name "*.spdx-json.sbom")"
            if [[ -z "${sboms}" ]]; then
              echo "[sbom] Missing SBOM"
              exit 1
            fi

            valid=true
            for sbom in ${sboms}; do
              if ! grep -q "info.picocli-picocli" "${sbom}"; then
                valid=false
                break
              fi
            done

            if [[ "${valid}" != "true" ]]; then
              echo "[sbom] Missing libraries in SBOM"
              exit 1
            fi
            zip -j "${sbomDirectory}/{{projectName}}-{{projectVersion}}-sboms.zip" ${sboms}
          fi
        verbose: true
        filter:
          includes: ['assemble']
release:
  github:
    releaseName: '{{tagName}}'
    overwrite: true
    update:
      enabled: false
    sign: true
    prerelease:
      pattern: '.*-(EA|SNAPSHOT)'
    issues:
      enabled: false
    changelog:
      formatted: 'ALWAYS'
      preset: 'conventional-commits'
      extraProperties:
        categorizeScopes: 'true'
      labelers:
        - label: 'dependencies'
          title: 'regex:^(?:deps(?:\(.*\))?!?):\s.*'
          order: 120
      categories:
        - title: '⚙️ Dependencies'
          key: 'dependencies'
          order: 55
          labels:
            - 'dependencies'
      replacers:
        - search: 'deps: '
      categoryTitleFormat: '### {{categoryTitle}}'
      contributorsTitleFormat: '### Contributors'
      content: |
        ## Changelog

        {{changelogChanges}}
        {{changelogContributors}}
        ## Verify Release

        See [VERIFICATION.md](VERIFICATION.md) for details.
      contributors:
        format: '- {{contributorName}}{{#contributorUsernameAsLink}} ({{.}}){{/contributorUsernameAsLink}}'
      hide:
        contributors:
          - 'p-marcin'
          - 'dependabot'
          - 'jdheim-actions'
          - 'github-actions'
          - 'GitHub'
