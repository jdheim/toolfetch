destination: "/tmp"
http:
  ssl:
    trustStore:
      path: "$JAVA_HOME/lib/security/cacerts"
      type: "PKCS12"
      # Use TOOLFETCH_HTTP_SSL_TRUSTSTORE_PASSWORD env variable for password
tools:
  - id: toolfetch
    version: "0.0.3"
    url: "https://github.com/jdheim/toolfetch/releases/download/v${version}/toolfetch-${version}-linux-amd64.tar.gz"
  - id: firefox
    version: "146.0.1"
    url: "https://ftp.mozilla.org/pub/firefox/releases/${version}/linux-x86_64/en-US/firefox-${version}.tar.xz"
